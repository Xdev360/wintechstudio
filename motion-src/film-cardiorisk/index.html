<!doctype html>
<html><head><meta charset="utf-8">
<!-- Brief 14 · Case study film: CardioRisk redesign · 1920x1080 · 12s loop, silent.
     Real Figma exports (file kQl8LQLi5xdRVVyXF3R4NZ, CardioRisk case study C6 952:22280), each at 2x with its shadow:
       poster.png   = public/images/cases/film-cardiorisk.webp at 1920 (the homepage hero, first and last frame)
       d2full/base  = "D2 · Assessment · clinical readings" (952:23678); base has the six values, their status lines
                      and the Live estimate card hidden, so the form can fill in
       d1full/base  = "D1 · Result" (952:23533); base has 23.4 %, the red band and marker, the factor bars,
                      the Main driver card and the three heart labels hidden
     Every number on screen is from those designs (162, 96, 182, 104, 64, 27.4, 21.8 %, 23.4 %, +8.1, +5.4, +3.2).
     The storyboard (1144:4326) swarms number cards into a heart; that needs screens that do not exist in the file,
     so the film follows the brief's own scenes on the real screens instead.
     Beats: 0:00 hero, 0:01.6 the assessment form fills, 0:04.9 Run assessment, 0:05.2 result, the gauge settles on
     23.4 %, 0:07 the factor bars grow (camera pushes 20%), the main driver and heart labels, 0:10.4 back to the hero. -->
<style>
  html,body{margin:0;background:#dcdddf}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:linear-gradient(135deg,#dee0e2 0%,#d7d8da 55%,#cecfd3 100%)}
  #cam{position:absolute;left:0;top:0;width:1920px;height:1080px}
  #card{position:absolute;left:153.6px;top:7.4px;width:1680px;height:1173px;transform:scale(.96);transform-origin:0 0}
  .g{position:absolute;left:0;top:0;width:1680px;height:1173px}
  .g>img{position:absolute;left:0;top:0;width:1680px;height:1173px}
  .rg{position:absolute;overflow:hidden}
  .rg>img{position:absolute;width:1680px;height:1173px}
  #mk{position:absolute;left:626px;top:576px;width:8px;height:5px;background:#17181a;clip-path:polygon(0 0,100% 0,50% 100%)}
  .rip{position:absolute;width:90px;height:90px;border-radius:50%;margin:-45px 0 0 -45px;border:4px solid rgba(255,255,255,.9);background:rgba(255,255,255,.18);opacity:0}
</style></head>
<body>
<div id="stage">
  <div id="cam"><div id="card">
    <div class="g" id="g2"><img src="a/d2base.webp"></div>
    <div class="g" id="g1" style="opacity:0"><img src="a/d1base.webp"></div>
    <div id="rip" class="rip"></div>
  </div></div>
  <img id="poster" src="a/poster.png" width="1920" height="1080" style="position:absolute;left:0;top:0">
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>cl((t-a)/(b-a));
const eOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const eOutQuart=t=>1-Math.pow(1-t,4);
const eOutCubic=t=>1-Math.pow(1-t,3);
const eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eSine=t=>-(Math.cos(Math.PI*t)-1)/2;
const X=x=>80+2*x, Y=y=>48+2*y;
// a window onto the full screen, placed over the base
function region(group,src,x0,y0,x1,y1){const d=document.createElement('div');d.className='rg';
  d.style.left=x0+'px';d.style.top=y0+'px';d.style.width=(x1-x0)+'px';d.style.height=(y1-y0)+'px';
  const i=document.createElement('img');i.src=src;i.style.left=-x0+'px';i.style.top=-y0+'px';d.appendChild(i);$(group).appendChild(d);return d;}

// D2: six readings typed in, in reading order
const F=[[53,214,'162',202,241],[201,214,'96',498,527],[53,293,'182',202,240],[201,293,'104',497,538],[53,372,'64',202,231],[201,372,'27.4',498,542]];
const T0=1.85, STEP=0.42, CH=0.075;
const fields=F.map(([x,y,v,g0,g1],i)=>({x,y,v,g0,g1,s:T0+i*STEP,
  inp:region('g2','a/d2full.webp',X(x),Y(y),X(x+137),Y(y+31)),
  st:region('g2','a/d2full.webp',X(x)-4,Y(y+35)-4,X(x+60),Y(y+44))}));
const live=region('g2','a/d2full.webp',X(570)-30,Y(327)-30,X(728)+30,Y(425)+40);
// D1 reveals
const num=region('g1','a/d1full.webp',X(53),Y(150),X(276),Y(237));
const band=region('g1','a/d1full.webp',374,583,760,591);
const mk=document.createElement('div');mk.id='mk';$('g1').appendChild(mk);
const BX=[55,90,125,159,194,229,264,299];
const bars=BX.map(b=>region('g1','a/d1full.webp',X(b)-3,Y(316),X(b+2)+3,Y(354)));
const drv=region('g1','a/d1full.webp',X(296)-26,Y(90)-26,X(454)+26,Y(275)+34);
const ann=[[454,224,528,236],[633,324,680,336],[517,430,578,442]].map(([a,b,c,d])=>region('g1','a/d1full.webp',X(a)-4,Y(b)-2,X(c)+4,Y(d)+2));

const ZX=153.6+X(196)*.96, ZY=7.4+Y(335)*.96; // camera push centre: the factor bars
window.render=function(t){
  // hero <-> app
  $('poster').style.opacity = t<6 ? 1-eSine(prog(t,0.85,1.35)) : eSine(prog(t,10.75,11.3));
  $('cam').style.opacity = t<6 ? eSine(prog(t,1.15,1.7)) : 1-eSine(prog(t,10.35,10.95));
  const enter=eOutCubic(prog(t,1.15,1.9));
  const z = t<6 ? lerp(1.03,1,enter) : lerp(1,1.2,eIO(prog(t,7.0,8.8)))*(1) ;
  const back=eIO(prog(t,10.2,11.0));
  const zz = t<6 ? z : lerp(z,0.985,back);
  $('cam').style.transformOrigin=`${ZX}px ${ZY}px`;
  $('cam').style.transform=`scale(${zz})`;

  // the form fills: each value types in, then its status line, then the unit
  fields.forEach(f=>{const n=f.v.length;const k=Math.floor(cl((t-f.s)/CH,0,n+1));
    let w=0;const box=X(f.x+137)-X(f.x);
    if(k>=1&&k<=n) w=(f.g0-X(f.x))+ (f.g1-f.g0+3)*k/n;
    if(k>n) w=box;
    f.inp.style.width=w+'px';
    f.st.style.opacity=eSine(prog(t,f.s+n*CH+0.05,f.s+n*CH+0.3));});
  const lu=eOutCubic(prog(t,4.35,4.8));live.style.opacity=lu;live.style.transform=`translateY(${(1-lu)*14}px)`;
  // tap Run assessment
  const ru=(t-4.95)/.5;const r=$('rip');
  if(ru<0||ru>1)r.style.opacity=0;else{r.style.left=X(141.5)+'px';r.style.top=Y(466.5)+'px';
    r.style.transform=`scale(${.55+.9*eOutCubic(ru)})`;r.style.opacity=(ru<.15?ru/.15:1-(ru-.15)/.85)*.9;}
  // result screen
  $('g1').style.opacity=eSine(prog(t,5.2,5.75));
  // the gauge: band appears, marker travels from 0% and settles on 23.4 %
  const gb=eOutCubic(prog(t,5.9,6.6));band.style.width=(386*gb)+'px';
  const gm=eOutExpo(prog(t,5.9,6.9));mk.style.transform=`translateX(${(374-186)*0+lerp(186-626,0,gm)}px)`;
  mk.style.opacity=cl(prog(t,5.85,6.0));
  const nu=eOutCubic(prog(t,6.45,7.0));num.style.opacity=nu;num.style.transform=`translateY(${(1-nu)*16}px)`;
  // factor bars grow up from the baseline like a waveform
  bars.forEach((b,i)=>{const s=7.1+i*0.07;const u=eOutQuart(prog(t,s,s+0.5));b.style.clipPath=`inset(${(1-u)*100}% 0 0 0)`;});
  // main driver card, then the labels on the heart
  const du=eOutCubic(prog(t,8.0,8.5));drv.style.opacity=du;drv.style.transform=`translateY(${(1-du)*20}px)`;
  ann.forEach((a,i)=>{const s=8.45+i*0.18;const u=eOutCubic(prog(t,s,s+0.35));a.style.opacity=u;a.style.transform=`translateX(${(1-u)*-8}px)`;});
};
window.render(0);
</script>
</body></html>
