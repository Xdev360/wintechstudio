<!doctype html>
<html><head><meta charset="utf-8">
<!-- Brief 15 · Brand and packaging service loop · 1168x876, 8s, silent, seamless loop.
     Frame 0 and the end match the coded "How we help" brand panel (empty mark card and swatch frame on #F4F5F7, 2x of the 584x438 art board).
     a/card.png         Tobel Pearls business card front, exported from Figma kQl8LQLi5xdRVVyXF3R4NZ (Tobel case study, 41 Business cards, node 953:85628 "Card front").
     a/card-nomark.png  the same card with the lockup mark painted out in Deep Navy, so the drawn mark can land in its place.
     a/jar.png          real Virelle Wellness jar and pouch photo from the store design (node 953:97049). No seal anywhere.
     Mark paths: public/images/cases/icon-tobel-pearls.svg. Colours and type from the Tobel guide: Tobel Blue #007DFE, Deep Navy #002269,
     Signal Orange #F2751F, White #FEFEFE; Figtree SemiBold and Regular. -->
<style>
  @font-face{font-family:Figtree;src:url(../../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
  html,body{margin:0;background:#0b0c0f}
  #stage{position:relative;width:1168px;height:876px;overflow:hidden;background:#F4F5F7;font-family:Figtree,sans-serif;color:#0A0E17}
  .l{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity}
  .box{background:#fff;border:2px solid rgba(3,17,28,.10);box-sizing:border-box}
  #markbox{left:84px;top:158px;width:440px;height:560px}
  #sw{left:604px;top:221px;width:480px;height:260px;display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
  #sw div{display:flex;align-items:flex-end;padding:12px;opacity:0}
  #sw span{font:500 17px/1 Figtree;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.2px}
  #type{left:604px;top:505px;width:480px;height:150px;display:flex;align-items:center;gap:24px;padding:0 28px}
  #type b{font:600 76px/1 Figtree;letter-spacing:-2px}
  #type p{margin:0;display:flex;flex-direction:column;gap:4px}
  #type strong{font:600 28px/34px Figtree}
  #type small{font:400 21px/26px Figtree;color:#6B7280}
  #name{left:84px;top:574px;width:440px;text-align:center;font:600 40px/48px Figtree;letter-spacing:-.6px;color:#002269}
  #mark{left:0;top:0;width:1168px;height:876px;overflow:visible}
  .card{border-radius:20px;box-shadow:0 30px 60px rgba(0,22,70,.18),0 6px 16px rgba(0,22,70,.10)}
  #jarw{width:380px;height:342px;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px rgba(4,30,20,.18),0 6px 16px rgba(4,30,20,.10)}
  #jarw img{width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
  .cap{font:500 22px/28px Figtree;color:#0A0E17;white-space:nowrap;text-align:center;width:500px}
  .cap i{font-style:normal;color:#6B7280}
</style></head>
<body>
<div id="stage">
  <div id="markbox" class="l box"></div>
  <div id="sw" class="l box">
    <div style="background:#007DFE;color:#fff"><span>#007DFE</span></div>
    <div style="background:#002269;color:#fff"><span>#002269</span></div>
    <div style="background:#F2751F;color:#fff"><span>#F2751F</span></div>
    <div style="background:#FEFEFE;color:#0A0E17;border-left:2px solid rgba(3,17,28,.08)"><span>#FEFEFE</span></div>
  </div>
  <div id="type" class="l box"><b>Aa</b><p><strong>Figtree</strong><small>SemiBold · Regular</small></p></div>
  <div id="name" class="l">Tobel Pearls.</div>

  <img id="card0" class="l card" src="a/card-nomark.png" width="560" height="362">
  <img id="card1" class="l card" src="a/card.png" width="560" height="362">
  <div id="jarw" class="l"><img id="jar" src="a/jar.png"></div>
  <div id="cap1" class="l cap">Tobel Pearls <i>· business card</i></div>
  <div id="cap2" class="l cap">Virelle Wellness Hub <i>· packaging</i></div>

  <svg id="mark" class="l" viewBox="0 0 1168 876">
    <g id="mg">
      <path class="mp" pathLength="1" d="M106.054 52.5274C106.054 52.5274 106.536 54.8714 106.192 55.1165C100.957 58.8439 94.9762 61.4479 91.0948 66.2635C89.7948 67.8764 88.7754 69.6103 87.7099 71.2636C80.7555 82.0541 76.9912 94.526 77.5207 106.899C74.8144 105.299 69.7034 100.412 68.2278 97.8729C68.674 95.9184 70.1462 92.7587 71.0124 90.8849C72.8719 87.1011 74.9851 83.2243 77.452 79.7143C79.1183 77.3432 80.7507 74.9438 82.4601 72.5969C81.1682 73.0637 77.762 73.79 76.1811 74.2205C72.4096 75.2475 69.622 76.1762 66.04 77.5601C66.8857 76.4354 69.5962 73.6946 70.7127 72.5442C72.463 70.9784 74.1279 68.8814 76.0553 67.4928C82.4706 62.8708 90.2256 59.4406 97.6599 56.2303L106.054 52.5274Z"/>
      <path class="mp" pathLength="1" d="M129.903 53.7221C129.939 53.7134 130.042 53.7239 130.086 53.7263C130.064 53.8515 128.262 55.8547 128.045 56.088C122.765 61.7584 119.69 67.8499 116.561 74.9422C113.102 74.8688 109.745 74.6883 106.264 74.9157C105.055 74.9945 103.373 75.0128 102.215 75.3058C100.984 76.6015 99.367 80.8154 98.8143 82.6179C96.4299 90.392 95.1948 98.6867 94.6319 106.791C94.4849 109.189 94.4223 111.591 94.4441 113.994C94.4466 115.561 94.4494 117.948 94.6723 119.473C93.4911 117.901 92.411 116.255 91.4385 114.546C89.11 110.105 87.7727 106.752 87.0028 101.757C85.1745 89.8939 86.427 78.7206 93.7108 68.8612C95.3774 66.836 98.2884 63.5163 100.586 61.9167C101.371 61.3698 103.842 60.3851 104.9 60.0105C104.9 60.0105 121.387 55.0129 129.903 53.7221Z"/>
      <path class="mp" pathLength="1" d="M137.378 72.8601C133.763 86.552 93.4865 79.7061 93.4865 76.6938C93.4865 76.6938 93.0538 78.1944 93.0538 71.2375C93.0538 64.2806 113.266 52.596 125.244 52.596C137.221 52.596 139.185 66.0141 137.378 72.8601Z"/>
    </g>
  </svg>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>cl((t-a)/(b-a));
const eIO=t=>-(Math.cos(Math.PI*t)-1)/2;
const eOut=t=>1-Math.pow(1-t,3);
const eIOC=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const mix=(c1,c2,k)=>'rgb('+c1.map((v,i)=>Math.round(lerp(v,c2[i],k))).join(',')+')';
const set=(el,x,y,s=1,o=1,r=0)=>{el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;el.style.opacity=o;};

// mark geometry (icon viewBox units)
const mg=$('mg'), paths=[...document.querySelectorAll('.mp')];
const bb=mg.getBBox(); const MC={x:bb.x+bb.width/2,y:bb.y+bb.height/2};
// card layout
const CW=560,CH=362,SC=CW/1065,ROT=-3;
const C0={x:470,y:410}, C1={x:360,y:410}, J={x:900,y:410};
// mark on the card image: bbox 70..186 x 69..176 (card.png px)
const off={x:(128-532.5)*SC,y:(122.5-344.5)*SC};
const rr=ROT*Math.PI/180;
const TGT={x:C0.x+off.x*Math.cos(rr)-off.y*Math.sin(rr), y:C0.y+off.x*Math.sin(rr)+off.y*Math.cos(rr), w:116*SC};
const START={x:304,y:392,w:230};

window.render=function(t){
  // --- kit (frame 0 state: empty card and swatch frame) ---
  const kitOut=eIO(prog(t,3.25,3.75)), kitIn=eIO(prog(t,6.9,7.5));
  const kitO=t<5?1-kitOut:kitIn;
  const kitS=t<5?lerp(1,.97,kitOut):lerp(.97,1,kitIn);
  ['markbox','sw'].forEach(id=>{set($(id),0,0,kitS,kitO)});
  // swatches slide in
  [...$('sw').children].forEach((d,i)=>{const k=eOut(prog(t,2.0+i*.15,2.6+i*.15));d.style.opacity=t<5?k:0;d.style.transform=`translateX(${(1-k)*60}px)`;});
  const ty=eOut(prog(t,2.75,3.3));
  set($('type'),0,(1-ty)*16,kitS,ty*(1-kitOut));
  const nm=eOut(prog(t,1.6,2.1));
  set($('name'),0,(1-nm)*12,1,nm*(1-kitOut));

  // --- mark: draw, then fly to the card ---
  const fly=eIOC(prog(t,3.65,4.5)), flyS=eOut(prog(t,3.65,4.2));
  const cx=lerp(START.x,TGT.x,fly), cy=lerp(START.y,TGT.y,fly), w=lerp(START.w,TGT.w,flyS), r=lerp(0,ROT,fly);
  const k=w/bb.width;
  mg.setAttribute('transform',`translate(${cx} ${cy}) rotate(${r}) scale(${k}) translate(${-MC.x} ${-MC.y})`);
  const fillK=eIO(prog(t,1.05,1.7));
  const col=mix([0,34,105],[255,255,255],eIO(prog(t,4.0,4.45)));
  paths.forEach((p,i)=>{const d=eIO(prog(t,.3+i*.18,1.25+i*.18));
    p.style.strokeDasharray='1 1';p.style.strokeDashoffset=1-d;
    p.setAttribute('stroke',col);p.setAttribute('stroke-width',(1.4/k*2.2).toFixed(3));p.setAttribute('stroke-linejoin','round');
    p.setAttribute('fill',col);p.setAttribute('fill-opacity',fillK.toFixed(3));
});
  const markO=t<0.3?0:(t<4.5?1:1-prog(t,4.5,4.62));
  mg.setAttribute('opacity',markO);
  // stroke thins out once filled so edges stay crisp
  paths.forEach(p=>p.setAttribute('stroke-opacity',(1-eIO(prog(t,1.5,2.0))).toFixed(3)));

  // --- surfaces ---
  const out=eIO(prog(t,6.45,7.05));
  const drift=lerp(1,1.025,eIO(prog(t,4.5,6.6)));
  const cin=eOut(prog(t,3.8,4.35));
  const cO=cin*(1-out);
  const slide=eIOC(prog(t,4.55,5.25)), ccx=lerp(C0.x,C1.x,slide);
  set($('card0'),ccx-CW/2,C1.y-CH/2+(1-cin)*24,drift*(1-out*.03),t<4.62?cO:0,ROT);
  set($('card1'),ccx-CW/2,C1.y-CH/2+(1-cin)*24,drift*(1-out*.03),t<4.5?0:cO,ROT);
  const jin=eOut(prog(t,4.9,5.5));
  set($('jarw'),J.x-190+(1-jin)*40,J.y-171,1-out*.03,jin*(1-out));
  $('jar').style.transform=`scale(${lerp(1.06,1,eIO(prog(t,4.3,6.6)))})`;
  const c1=eOut(prog(t,5.1,5.6)), c2=eOut(prog(t,5.35,5.85));
  set($('cap1'),C1.x-250,640+(1-c1)*10,1,c1*(1-out));
  set($('cap2'),J.x-250,640+(1-c2)*10,1,c2*(1-out));
};
render(0);
</script>
</body></html>
