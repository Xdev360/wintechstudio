<!doctype html>
<html><head><meta charset="utf-8">
<!-- Brief 7 · Hero film: Let's Hang. 1280x720, 7s loop. Real screens from Figma (poster panel 953:79019, lh_m_* screens). -->
<style>
  html,body{margin:0;background:#f5f3ff}
  #stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#f5f3ff}
  #d{position:absolute;left:0;top:0;width:1360px;height:765px;transform:scale(0.9411765);transform-origin:0 0}
  #d img,#d div{position:absolute;left:0;top:0}
  .scr{width:672px;height:1454px}
  .rip{width:100px;height:100px;border-radius:50%;margin:-50px 0 0 -50px;border:5px solid rgba(255,255,255,.95);background:rgba(131,77,251,.28);box-shadow:0 0 0 2px rgba(131,77,251,.35);opacity:0}
</style></head>
<body>
<div id="stage">
  <div id="d">
    <img id="bg" src="a/bg.png" width="1360" height="765">
    <img id="rooms" src="a/ph-rooms.png" width="495" height="754.5" style="left:48.9px;top:87.55px">
    <img id="hangph" src="a/ph-hang.png" width="495" height="754.5" style="left:478.8px;top:-7.45px">
    <div id="grp" style="left:811.6px;top:83.15px;width:408px;height:721px;transform-origin:203.9px 326.85px">
      <img src="a/bezel.png" width="408" height="721">
      <div id="screen" style="left:69.6px;top:36.05px;width:268.53px;height:581.54px;border-radius:35.24px;overflow:hidden;background:#f5f3ff">
        <div id="inner" class="scr" style="transform:scale(0.39960);transform-origin:0 0">
          <div id="mapwrap" class="scr">
            <img src="a/s-bare.png" class="scr">
            <div id="pins"></div>
            <img id="ring" src="a/peek-ring.png" class="scr">
            <img id="card" src="a/peek-card.png" class="scr">
            <div id="r1" class="rip"></div><div id="r2" class="rip"></div><div id="r3" class="rip"></div>
          </div>
          <div id="hang" class="scr" style="background:url(a/s-hang.png) 0 0/100% 100%;box-shadow:-30px 0 60px rgba(27,16,51,.18)"></div>
          <div id="live" class="scr" style="background:url(a/s-live.png) 0 0/100% 100%;box-shadow:0 -30px 60px rgba(27,16,51,.25)"></div>
        </div>
      </div>
    </div>
    <img id="label" src="a/label.png" width="352.75" height="55.25" style="left:14.875px;top:701.25px">
  </div>
  <img id="poster" src="a/poster.png" width="1280" height="720" style="position:absolute;left:0;top:0">
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>cl((t-a)/(b-a));
const eOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const eOutCubic=t=>1-Math.pow(1-t,3);
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eOutBack=t=>{const c1=1.3,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};

// pins: sprite boxes in screen px (672x1454), origin at the pin tip
const PINS=[{"n":"afro","x":5,"y":223,"w":258,"h":251,"ox":133,"oy":390},{"n":"live","x":225,"y":223,"w":217,"h":251,"ox":328,"oy":390},{"n":"paint","x":433,"y":223,"w":211,"h":251,"ox":530,"oy":390},{"n":"five","x":36,"y":418,"w":211,"h":253,"ox":133,"oy":585},{"n":"build","x":380,"y":418,"w":288,"h":253,"ox":523,"oy":585},{"n":"tech","x":191,"y":613,"w":248,"h":252,"ox":316,"oy":780},{"n":"girls","x":436,"y":613,"w":215,"h":252,"ox":537,"oy":780},{"n":"gallery","x":33,"y":810,"w":208,"h":251,"ox":127,"oy":977},{"n":"venue","x":320,"y":810,"w":224,"h":251,"ox":430,"oy":977},{"n":"ilashe","x":141,"y":1006,"w":208,"h":252,"ox":235,"oy":1173}];
for(const p of PINS){const i=document.createElement('img');i.src=`a/pin-${p.n}.png`;i.width=p.w;i.height=p.h;
  i.style.left=p.x+'px';i.style.top=p.y+'px';i.style.transformOrigin=`${p.ox-p.x}px ${p.oy-p.y}px`;i.id='pin-'+p.n;$('pins').appendChild(i);}

// timeline (s)
const T={posterOut:[.3,.6], move:[.5,1.3], clear:[.55,.85], pop0:1.2, popStep:.105, popDur:.4,
  tapFive:2.45, peekIn:[2.55,3.0], tapJoin:3.2, hangIn:[3.35,3.8], hangOut:[4.4,4.8],
  tapLive:4.95, liveIn:[5.05,5.5], liveOut:[6.0,6.4], back:[6.1,6.8], posterIn:[6.8,6.95]};

function ripple(id,t,c,x,y){const u=(t-c)/.5;const el=$(id);
  if(u<0||u>1){el.style.opacity=0;return;}
  el.style.left=x+'px';el.style.top=y+'px';
  el.style.transform=`scale(${.55+.9*eOutCubic(u)})`;el.style.opacity=(u<.15?u/.15:1-(u-.15)/.85)*.95;}

window.render=function(t){
  // full poster at both ends
  $('poster').style.opacity = window.NOPOSTER?0: t<3 ? 1-eInOut(prog(t,...T.posterOut)) : eInOut(prog(t,...T.posterIn));
  // phones: map phone to centre, the other two drift out
  const m=eInOut(prog(t,...T.move))*(1-eInOut(prog(t,...T.back)));
  const f=eInOut(prog(t,.5,1.05))*(1-eInOut(prog(t,6.3,6.8)));
  $('grp').style.transform=`translate(${-335.5*m}px,${-27.5*m}px) scale(${1+.17*m})`;
  $('rooms').style.transform=`translate(${-70*m}px,0)`;$('rooms').style.opacity=1-f;
  $('hangph').style.transform=`translate(${-40*m}px,${24*m}px)`;$('hangph').style.opacity=1-f;
  // pins: all out (poster to empty map), then back one by one
  const out=prog(t,...T.clear);
  PINS.forEach((p,i)=>{const el=$('pin-'+p.n);
    if(t<1.0){el.style.opacity=1-out;el.style.transform='';return;}
    const a=T.pop0+i*T.popStep;const u=prog(t,a,a+T.popDur);
    el.style.opacity=cl(u/.45);el.style.transform=`translateY(${-14*(1-eOutCubic(u))}px) scale(${.55+.45*eOutBack(u)})`;});
  // Peek card and the selected ring
  const pOut=eInOut(prog(t,...T.clear)), pIn=eOutExpo(prog(t,...T.peekIn));
  const peek = t<2 ? 1-pOut : pIn;
  $('card').style.opacity=t<2?1-pOut:cl(prog(t,...T.peekIn)*2.2);
  $('card').style.transform=`translateY(${t<2?40*pOut:60*(1-pIn)}px)`;
  $('ring').style.opacity=t<2?1-pOut:prog(t,2.5,2.7);
  // the hang (push from right) and the live room (from below)
  const hx=t<4?1-eOutExpo(prog(t,...T.hangIn)):eInOut(prog(t,...T.hangOut));
  $('hang').style.transform=`translateX(${800*hx}px)`;
  $('mapwrap').style.transform=`translateX(${t<4?-90*(1-hx):-90*(1-hx)}px)`;
  const ly=t<5.8?1-eOutExpo(prog(t,...T.liveIn)):eInOut(prog(t,...T.liveOut));
  $('live').style.transform=`translateY(${1600*ly}px)`;
  // taps
  ripple('r1',t,T.tapFive,133,510);ripple('r2',t,T.tapJoin,465,1221);ripple('r3',t,T.tapLive,328,315);
};
window.render(0);
</script>
</body></html>
