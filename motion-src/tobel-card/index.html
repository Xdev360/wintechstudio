<!doctype html>
<html><head><meta charset="utf-8">
<!-- Tobel Pearls card loop (Nov 2026) · 1312x984 · 8s, silent, seamless.
     Real exports: cover.png = "cover · Tobel Pearls" (880:12895) at 1312 wide; p05..p30 = guide pages from the case study (C4 953:85192);
     bg = Tobel blue grid plate; truck = "Truck - Primary blue" livery (953:86218).
     Story ("five days, maximum"): the cover holds, dissolves to the blue grid, the 55-page guide flips through like a flipbook
     while DAY 1 counts to DAY 5, the Tobel truck drives across on day 5, and the cover returns. -->
<style>
  @font-face{font-family:Figtree;src:url(../../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
  html,body{margin:0;background:#002269}
  #stage{position:relative;width:1312px;height:984px;overflow:hidden;background:#0057d6;font-family:Figtree,sans-serif}
  #bg{position:absolute;left:0;top:0;width:1312px;height:984px;object-fit:cover}
  #book{position:absolute;left:376px;top:250px;width:860px;height:516px}
  .pg{position:absolute;left:0;top:0;width:860px;height:516px;border-radius:12px;box-shadow:0 30px 70px rgba(0,20,80,.45);transform-origin:0 50%;backface-visibility:hidden}
  #lab{position:absolute;left:76px;top:250px;color:#fff}
  #lab small{display:block;font:500 15px/20px 'Geist Mono',ui-monospace,monospace;letter-spacing:1.4px;opacity:.75}
  #digw{position:relative;height:250px;width:240px;overflow:hidden;margin-top:6px}
  .d{position:absolute;left:-6px;top:0;font:600 250px/250px Figtree,sans-serif;letter-spacing:-6px}
  #pips{display:flex;gap:8px;margin-top:22px}
  #pips i{width:34px;height:7px;border-radius:4px;background:rgba(255,255,255,.28)}
  #cap{margin-top:22px;font:500 22px/30px Figtree,sans-serif;max-width:250px}
  #cap b{color:#F2751F;font-weight:500}
  #truck{position:absolute;top:792px;width:560px}
  #road{position:absolute;left:0;top:930px;width:1312px;height:2px;background:rgba(255,255,255,.18)}
  #cover{position:absolute;left:-14px;top:0;width:1340px;height:984px;object-fit:cover}
</style></head>
<body>
<div id="stage">
  <img id="bg" src="a/bg.webp">
  <div id="road"></div>
  <div id="lab"><small>CLEARED IN</small><div id="digw"></div><div id="pips"><i></i><i></i><i></i><i></i><i></i></div><p id="cap">Five days, <b>maximum.</b></p></div>
  <div id="book"></div>
  <img id="truck" src="a/truck.webp">
  <img id="cover" src="a/cover.png">
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eO=t=>1-Math.pow(1-t,3);
const pages=['p05','p07','p11','p15','p17','p19','p22','p24','p28','p30'];
const book=$('book');
pages.slice().reverse().forEach(p=>{const im=document.createElement('img');im.className='pg';im.src='a/'+p+'.webp';im.dataset.p=p;book.appendChild(im);});
const els=[...book.children].reverse(); // els[0] = top page
const digw=$('digw');for(let i=1;i<=5;i++){const d=document.createElement('div');d.className='d';d.textContent=i;d.style.top=((i-1)*250)+'px';digw.appendChild(d);}
const pips=[...$('pips').children];
window.render=function(t){
  // cover: holds, dissolves out 0.7-1.3, back in 6.9-7.5
  const cOut=eIO(P(t,.7,1.3)), cIn=eIO(P(t,6.9,7.5));
  const co=t<4?1-cOut:cIn;
  $('cover').style.opacity=co;
  $('cover').style.transform=`scale(${1+0.06*(t<4?cOut:1-cIn)})`;
  // book rises in
  const rise=eO(P(t,1.0,1.8)), fall=eIO(P(t,6.3,7.0));
  book.style.transform=`translateY(${(1-rise)*80+fall*60}px) rotate(${-3+2*(1-rise)}deg)`;
  book.style.opacity=rise*(1-fall);
  // flipbook: 9 flips between 1.9 and 5.3
  const n=els.length-1, f0=1.9, f1=5.3, step=(f1-f0)/n;
  els.forEach((el,i)=>{
    const a=f0+i*step, u=eIO(P(t,a,a+step*1.25));
    const flipped=i<n?u:0;
    el.style.transform=`perspective(2600px) rotateY(${-flipped*165}deg)`;
    el.style.zIndex=String(100-i+(flipped>.5?-200:0));
    el.style.opacity=flipped>.92?0:1;
  });
  // DAY counter 1..5 follows the flips
  const dprog=cl((t-1.9)/(5.3-1.9))*4;
  const k=Math.floor(dprog), fr=eIO(cl((dprog-k)*1.6-0.6));
  const dv=Math.min(4,k+fr);
  digw.style.transform='';[...digw.children].forEach((d,i)=>d.style.transform=`translateY(${-dv*250}px)`);
  pips.forEach((p,i)=>p.style.background=i<=Math.round(dv)?(i===4?'#F2751F':'#fff'):'rgba(255,255,255,.28)');
  const lab=$('lab');lab.style.opacity=rise*(1-fall);lab.style.transform=`translateX(${(1-rise)*-30}px)`;
  // truck crosses on day 5
  const tr=eIO(P(t,4.9,6.7));
  $('truck').style.left=(-620+tr*(1312+700))+'px';
  $('truck').style.opacity=t>4.8&&t<6.8?1:0;
};
window.render(0);
</script>
</body></html>
