<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>cl((t-a)/(b-a));
const eOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const eOutCubic=t=>1-Math.pow(1-t,3);
const eOutQuad=t=>1-(1-t)*(1-t);
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eInOutSine=t=>-(Math.cos(Math.PI*t)-1)/2;
const eOutBack=(t,c1=1.70158)=>{const c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const NS='http://www.w3.org/2000/svg';

const S=1312/480;                       // storyboard keyframe -> stage
const LOCK={x:40*S,y:124.149169921875*S};// lockup origin on stage (keyframe 01)
const EC=55.6796;                       // emblem centre (units)
const K01={x:LOCK.x,y:LOCK.y,s:S};
const SB=S/0.45;                        // keyframe 02: seal big, centred
const K02={x:656-EC*SB,y:492-EC*SB,s:SB};
const STAR_U={x:46.0740+9.6047,y:23.1206+9.6047}; // star centre in emblem units
const SOCKET={x:K01.x+STAR_U.x*S,y:K01.y+STAR_U.y*S};
const STAR_PX=19.2095;                  // star size in units

// --- arch centreline: average the outer and inner contours of the real Arch path
(function(){
  const d=$('archShape').getAttribute('d');
  const subs=d.split('Z').map(s=>[...s.matchAll(/(-?[\d.]+) (-?[\d.]+)/g)].map(m=>[+m[1],+m[2]])).filter(a=>a.length);
  let outer=subs[0].slice(1,-2);          // (0,59.1) ... (83.52,56.04)
  let inner=subs[1].slice(0,-3).reverse(); // (6.04,57.37) ... (77.59,59.11)
  function resample(pts,n){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    const T=L[L.length-1],out=[];let j=0;for(let k=0;k<n;k++){const s=T*k/(n-1);while(j<L.length-2&&L[j+1]<s)j++;const u=(s-L[j])/((L[j+1]-L[j])||1);
      out.push([lerp(pts[j][0],pts[j+1][0],u),lerp(pts[j][1],pts[j+1][1],u)]);}return out;}
  const A=resample(outer,80),B=resample(inner,80);
  const mid=A.map((p,i)=>[(p[0]+B[i][0])/2,(p[1]+B[i][1])/2]);
  const xl=3.0044, xr=80.594, yb=108.355;
  let s=`M ${xl} ${yb} L ${xl} ${mid[0][1].toFixed(3)}`;
  for(const p of mid) s+=` L ${p[0].toFixed(3)} ${p[1].toFixed(3)}`;
  s+=` L ${xr} ${yb} L ${xl+4} ${yb}`;
  $('mArch').setAttribute('d',s);
})();
const SEG=['mArch','mLeg1','mLeg2','mBand'].map(id=>{const el=$(id);const L=el.getTotalLength();el.setAttribute('stroke-dasharray',`${L} ${L+10}`);return {el,L};});
// one pen: arch, rehal legs, cover band, then the pages open from the spine
const SPLIT=[0,.56,.65,.74,.84,1];
function setInk(u){ // u 0..1
  SEG.forEach((g,i)=>{const p=prog(u,SPLIT[i],SPLIT[i+1]);g.el.setAttribute('stroke-dashoffset',String(g.L*(1-p)));});
  const pp=eOutCubic(prog(u,SPLIT[4],1)), w=32*pp;
  $('mPL').setAttribute('x',String(33-w));$('mPL').setAttribute('width',String(w));
  $('mPR').setAttribute('x',String(33));$('mPR').setAttribute('width',String(w));
  // nib at the pen head
  let head=null;
  for(let i=0;i<4;i++){const p=prog(u,SPLIT[i],SPLIT[i+1]);if(p>0&&p<1){const g=SEG[i];const pt=g.el.getPointAtLength(g.L*p);
    head=i===0?{x:pt.x+13.8813,y:pt.y}:{x:pt.x+22.7635,y:pt.y+52.8417};}}
  return head;
}

// --- ribbon (stage) and the sukun ring (phone export px)
const RING={cx:353,cy:540,rx:29,ry:31.5};
const ringD=`M ${RING.cx} ${RING.cy-RING.ry} A ${RING.rx} ${RING.ry} 0 0 1 ${RING.cx} ${RING.cy+RING.ry} A ${RING.rx} ${RING.ry} 0 0 1 ${RING.cx} ${RING.cy-RING.ry}`;
for(const id of ['guide','trace','ringInk']) $(id).setAttribute('d',ringD);
const RL=$('trace').getTotalLength();
$('trace').setAttribute('stroke-dasharray',`${RL} ${RL+50}`);
$('ringInk').setAttribute('stroke-dasharray',`${RL} ${RL+50}`);
$('gdot').setAttribute('cx',RING.cx);$('gdot').setAttribute('cy',RING.cy-RING.ry);

// phone poses: export anchor (ax,ay) placed at stage (X,Y), scale f
const PH3={ax:361.5,ay:782,X:930,Y:492,f:.5};
const PH4={ax:361.5,ay:606,X:656,Y:492,f:1};
function phonePose(t){
  const m=eInOut(prog(t,3.45,4.45));
  const p={ax:lerp(PH3.ax,PH4.ax,m),ay:lerp(PH3.ay,PH4.ay,m),X:lerp(PH3.X,PH4.X,m),Y:lerp(PH3.Y,PH4.Y,m),f:lerp(PH3.f,PH4.f,m)};
  p.X+=80*(1-eOutExpo(prog(t,2.6,3.3)));
  return p;}
function toStage(p,x,y){return {x:p.X+(x-p.ax)*p.f,y:p.Y+(y-p.ay)*p.f};}
const TICK={x:548,y:536,s:4.6};   // tick centre (export px) and icon scale

// rays
for(let i=0;i<12;i++){const l=document.createElementNS(NS,'line');$('rays').appendChild(l);}

function sealPose(t){
  let P;
  if(t<1.0) P=K01;
  else if(t<2.35){const m=eInOut(prog(t,1.0,1.9));P={x:lerp(K01.x,K02.x,m),y:lerp(K01.y,K02.y,m),s:lerp(K01.s,K02.s,m)};}
  else {const m=eInOutSine(prog(t,2.35,2.95));P={x:lerp(K02.x,K01.x,m),y:lerp(K02.y,K01.y,m),s:lerp(K02.s,K01.s,m)};}
  return P;}

window.render=function(t){
  // lattice drifts one full tile (65.6px) left over the 9s loop, so it wraps seamlessly
  $('latr').setAttribute('transform',`translate(${-65.6*(t/9)} 0)`);

  // ---------- seal
  const P=sealPose(t);
  let ex=P.x, ey=P.y, es=P.s, so=1;
  // exit left as the camera pushes into the phone
  const out=eInOut(prog(t,3.5,4.1)); ex-=380*out; so=1-out;
  // return to keyframe 01 for the star
  if(t>=6.55){const r=eOutCubic(prog(t,6.55,7.2)); const k=lerp(.94,1,r);
    ex=K01.x+EC*S*(1-k); ey=K01.y+EC*S*(1-k); es=S*k; so=r;}
  $('sealG').setAttribute('transform',`translate(${ex} ${ey}) scale(${es})`);
  $('sealG').style.opacity=so;
  // ink: solid until 1.0, then the pen redraws it over a faint guide
  const drawing=t>=1.0&&t<2.4;
  $('solid').style.opacity= t<1.0 ? 1 : 1-prog(t,1.0,1.18);
  $('ghost').style.opacity= .13*prog(t,1.0,1.2)*(1-prog(t,2.2,2.4));
  const u = t<1.0 ? 1 : eInOut(prog(t,1.04,2.24));
  const head=setInk(u);
  if(head&&drawing){$('nibG').style.display='';$('nibG').setAttribute('transform',`translate(${head.x} ${head.y})`);}
  else $('nibG').style.display='none';
  $('sealStar').style.opacity= t<1.0?1:Math.max(0,1-prog(t,1.0,1.15));

  // names + divider
  const no = t<1.0 ? 1 : (t<5 ? 1-prog(t,1.0,1.3) : prog(t,7.95,8.25));
  $('names').style.transform=`translate(${LOCK.x+149*S}px,${LOCK.y}px)`; $('names').style.opacity=no;
  $('div').style.transform=`translate(${LOCK.x+129.7387*S}px,${LOCK.y+7.9663*S}px)`; $('div').style.opacity=no;

  // ---------- phone
  const pp=phonePose(t);
  let pf=pp.f, po=eOutCubic(prog(t,2.6,3.0));
  // soft pulse when the trace completes
  const pu=prog(t,5.47,5.9); const pulse=1+.02*Math.sin(Math.PI*pu)*(pu>0&&pu<1?1:0);
  // falls back and dims for the star
  const fb=eInOut(prog(t,6.12,6.9)); const fbs=lerp(1,.9,fb);
  po*=1-eInOut(prog(t,6.45,6.9));
  const k=pf*pulse*fbs;
  // scale about the anchor point
  const tx=pp.X-pp.ax*k, ty=pp.Y-pp.ay*k+40*fb;
  $('phone').style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
  $('phone').style.opacity=po; $('phone').style.display=po>0.001?'':'none';
  $('phimg').style.filter=fb>0?`brightness(${1-.62*fb})`:'';

  // ring ink arrives with the ribbon, then settles into the faint guide
  const ri=eOutCubic(prog(t,3.28,3.62));
  $('ringInk').setAttribute('stroke-dashoffset',String(RL*(1-ri)));
  $('ringInk').style.opacity=ri>0?1-prog(t,3.62,3.9):0;
  $('guide').style.opacity=prog(t,3.62,3.9);
  const gd=eOutBack(prog(t,3.85,4.1)); $('gdot').setAttribute('r',String(15*gd)); $('gdot').style.opacity=prog(t,3.85,3.95);
  // trace: finger enters, then follows the guide for 900ms
  const tr=eInOutSine(prog(t,4.6,5.45));
  $('trace').setAttribute('stroke-dashoffset',String(RL*(1-tr)));
  $('trace').style.opacity=tr>0?1:0;
  const tip = tr>0 ? $('trace').getPointAtLength(RL*tr) : {x:RING.cx,y:RING.cy-RING.ry};
  const fin=eOutQuad(prog(t,4.15,4.6)), fout=eInOutSine(prog(t,5.55,6.05));
  const fx=tip.x+260*(1-fin)+150*fout, fy=tip.y+340*(1-fin)+220*fout;
  const FS=3.6; // lucide 24 -> 86px
  $('finger').setAttribute('transform',`translate(${fx-8*FS} ${fy-2*FS}) scale(${FS})`);
  $('finger').style.opacity= t<4.15?0: cl(prog(t,4.15,4.35))*(1-prog(t,5.6,6.0));
  // tick pops beside the letter, then flashes into the star
  const tk=prog(t,5.55,5.9), tf=prog(t,6.2,6.36);
  const ts=TICK.s*(tk>0?lerp(.8,1,eOutBack(tk)):0)*(1+.2*tf);
  $('tick').setAttribute('transform',`translate(${TICK.x-12*ts} ${TICK.y-12*ts}) scale(${ts})`);
  $('tick').style.opacity=cl(tk*3)*(1-tf);

  // ---------- gold star
  const tickStage=toStage({...pp,f:k,ay:pp.ay,ax:pp.ax,Y:pp.Y+40*fb},TICK.x,TICK.y);
  // burst origin is frozen where the tick was at 6.2
  const pp62=phonePose(6.2); const O=toStage(pp62,TICK.x,TICK.y);
  const BASE=166/STAR_PX;           // 100% of the burst star, in units -> px
  const LAND=S;                     // socket scale
  let sx=O.x, sy=O.y, sc=0, rot=0, sop=0;
  if(t>=6.22 && t<6.85){const b=prog(t,6.22,6.57); sc=BASE*1.6*eOutBack(b,1.4); rot=22*eOutCubic(b); sop=b>0?1:0;}
  else if(t>=6.85 && t<7.55){const f=eInOutSine(prog(t,6.85,7.55)); sx=lerp(O.x,SOCKET.x,f); sy=lerp(O.y,SOCKET.y,f)-90*Math.sin(Math.PI*f);
    sc=lerp(BASE*1.6,LAND*1.4,eInOut(prog(t,6.85,7.55))); rot=lerp(22,0,f); sop=1;}
  else if(t>=7.55){const l=prog(t,7.55,7.95); sx=SOCKET.x; sy=SOCKET.y; sc=LAND*lerp(1.4,1,eOutBack(l,1.6)); rot=0; sop=1;}
  $('fstar').setAttribute('transform',`translate(${sx} ${sy}) rotate(${rot}) scale(${Math.max(sc,0.0001)})`);
  $('fstar').style.opacity=sop;
  // glow follows the star, strongest at the burst
  const gl=prog(t,6.22,6.45)*(1-prog(t,6.85,7.5));
  $('sglow').setAttribute('cx',sx);$('sglow').setAttribute('cy',sy);
  $('sglow').setAttribute('r',String(260*lerp(.4,1,gl)));$('sglow').style.opacity=gl;
  // rays shoot out and fade
  const ry=prog(t,6.3,6.68); const r0=88+62*eOutCubic(ry), len=36*(1-ry);
  [...$('rays').children].forEach((l,i)=>{const a=(i*30+15)*Math.PI/180;
    l.setAttribute('x1',O.x+Math.cos(a)*r0);l.setAttribute('y1',O.y+Math.sin(a)*r0);
    l.setAttribute('x2',O.x+Math.cos(a)*(r0+len));l.setAttribute('y2',O.y+Math.sin(a)*(r0+len));
    l.style.opacity=ry>0&&ry<1?(1-ry)*.9:0;});
  // one faint glint as the star settles
  const g=prog(t,7.85,8.3); const gs=Math.sin(Math.PI*g);
  $('glint').setAttribute('transform',`translate(${SOCKET.x+22} ${SOCKET.y-24}) rotate(${45*g}) scale(${gs*1.1})`);
  $('glint').style.opacity=g>0&&g<1?gs*.85:0;

  // ---------- ribbon: the stroke peels off the seal and sweeps into the phone
  const A=(()=>{const P2=sealPose(Math.min(t,2.95));const ox=P2.x,oy=P2.y,s=P2.s;return {x:ox+(13.8813+80.594)*s,y:oy+108.355*s};})();
  const E=toStage(phonePose(t),RING.cx,RING.cy-RING.ry);
  const rd=`M ${A.x} ${A.y} C ${A.x+90} ${A.y+120} ${A.x+300} ${A.y+130} ${A.x+340} ${A.y-30} S ${E.x-110} ${E.y-6} ${E.x} ${E.y}`;
  const rp=$('ribp'); rp.setAttribute('d',rd);
  // white over the navy, Royal Lapis once it crosses onto the phone screen
  const pl=toStage(phonePose(t),10,0).x; $('rg').setAttribute('x1',pl-6); $('rg').setAttribute('x2',pl+34);
  const L=rp.getTotalLength();
  const h=eOutCubic(prog(t,2.72,3.35))*L, tl=eInOut(prog(t,2.95,3.6))*L;
  if(h>0 && tl<L-0.5){rp.style.display='';rp.setAttribute('stroke-dasharray',`${Math.max(h-tl,0.01)} ${L*3}`);rp.setAttribute('stroke-dashoffset',String(-tl));}
  else rp.style.display='none';
};
window.render(0);
</script>
</body></html>
